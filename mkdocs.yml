site_name: JZ Notes
site_description: 个人知识笔记
site_url: https://shaojiazhen.github.io/ObsidianNote/
repo_url: https://github.com/ShaoJiaZhen/ObsidianNote
repo_name: ShaoJiaZhen/ObsidianNote
edit_uri: edit/main/docs/

docs_dir: docs

# Convert Obsidian-style intra-doc heading wikilinks like `[[#7.5 代码审查阶段]]`
# into plain markdown anchor links before pub-obsidian sees them, so the
# resolved anchor matches the default toc-generated heading id.
hooks:
  - _mkdocs_hooks.py

theme:
  name: material
  language: zh
  favicon: assets/images/favicon.svg
  icon:
    logo: material/notebook-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

plugins:
  - search:
      lang: [zh, en]
  - tags:
      tags_file: tags.md
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      js_files:
        - assets/javascripts/bundle.*.min.js
      css_files:
        - assets/stylesheets/main.*.min.css
  - pub-meta:
      publish:
        file_default: false       # opt-in: files default to NOT published
        dir_default: true         # directories default to published (so dir contents inherit unless file overrides)
        file_warn_on_missing: false
  - pub-obsidian:
      callouts:
        enabled: true
      links:
        wikilinks_enabled: true
      backlinks:
        enabled: false
      vega:
        enabled: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 标签: tags.md

# Exclude internal/build files from the built site (paths relative to docs_dir)
exclude_docs: |
  superpowers/
